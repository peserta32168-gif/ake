function towersPage(){return `${pageTitle('Galeri Menara Gerabah','Setiap menara tumbuh sesuai total poin kelompok asal.',`<button class="outline" onclick="go('results')">Lihat hasil →</button>`)}<div class="notice">Menara gerabah merupakan representasi kreatif untuk pembelajaran, terinspirasi warna dan bentuk gerabah Kasongan. Tinggi visual mengikuti total skor kelompok.</div>${towerGrid(true)}`}
function towerGrid(large=false){let sorted=[...state.teams].sort((a,b)=>total(b)-total(a));let max=Math.max(1,...sorted.map(total));return `<div class="tower-grid">${sorted.map((t,i)=>{let score=total(t),n=score===0?1:Math.min(6,Math.max(1,Math.ceil(score/max*6)));return `<div class="tower-card ${i===0&&score>0?'champ':''}"><span class="rank">#${i+1}</span><div class="tower" style="height:${large?230:170}px">${Array.from({length:n},(_,j)=>`<div class="pot" style="--w:${38+j*4}px;--h:${large?29:25}px;animation-delay:${j*.04}s"></div>`).join('')}</div><div class="tower-base"></div><div class="tower-name">${esc(t.name)}</div><div class="tower-score">${score.toLocaleString('id-ID')} <span style="font-size:11px">poin</span></div><div class="tower-meta">${t.members.length} anggota</div>${i===0&&score>0?'<div style="margin-top:9px;color:#9a6b14;font-size:11px;font-weight:800">✦ JUARA SEMENTARA</div>':''}${large?`<div style="margin-top:12px;text-align:left;border-top:1px solid var(--line);padding-top:9px">${t.members.map(m=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0"><span>${esc(m.name)}</span><b>${m.score}</b></div>`).join('')}</div>`:''}</div>`}).join('')}</div>`}
function resultsPage(){let members=allMembers();return `${pageTitle('Hasil & ekspor','Rekap poin tim, kontribusi anggota, dan hasil arena.',`<button class="primary" onclick="exportCSV()">↓ Ekspor CSV</button>`)}<div class="card"><h3>Peringkat kelompok asal</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Peringkat</th><th>Kelompok</th><th>Anggota</th><th>Total poin</th></tr></thead><tbody>${[...state.teams].sort((a,b)=>total(b)-total(a)).map((t,i)=>`<tr><td>#${i+1}</td><td><b>${esc(t.name)}</b></td><td>${t.members.length}</td><td><b>${total(t)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h3>Kontribusi anggota</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Murid</th><th>Kelompok asal</th><th>Arena</th><th>Poin</th><th>Jawaban benar</th></tr></thead><tbody>${members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.teamName)}</td><td>${esc(state.arenas.find(a=>a.id===Number(m.arena))?.name||'-')}</td><td>${m.score}</td><td>${Object.values(state.answers).filter(a=>a.memberId===m.id&&a.correct).length}</td></tr>`).join('')}</tbody></table></div></div><div class="section">${towerGrid()}</div>`}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
let timerInterval=null;
function startGame(){if(!state.questions.length){toast('Tambahkan soal terlebih dahulu.');return}state.status='Berlangsung';state.remaining=Number(currentQ()?.duration||state.duration);state.endsAt=Date.now()+state.remaining*1000;state.revealed=false;save();render();runTimer();toast('Permainan dimulai!')}
function runTimer(){clearInterval(timerInterval);const tick=()=>{if(state.status!=='Berlangsung'){clearInterval(timerInterval);return}if(state.endsAt){state.remaining=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));}else{state.remaining=Math.max(0,state.remaining-1);}let el=document.getElementById('timer'),bar=document.getElementById('timerBar');if(el)el.textContent=formatTime(state.remaining);let qt=document.getElementById('questionTimer');if(qt)qt.textContent=formatTime(state.remaining);if(bar)bar.style.width=(100*state.remaining/Math.max(1,currentQ()?.duration||state.duration))+'%';if(state.remaining<=0){state.status='Menunggu';state.endsAt=null;clearInterval(timerInterval);if(state.page!=='student'){save();render();toast('Waktu habis. Jawaban ditutup.')}else{render();}}};tick();if(state.status==='Berlangsung')timerInterval=setInterval(tick,250)}
function pauseGame(){if(state.status==='Berlangsung'){if(state.endsAt)state.remaining=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));state.endsAt=null;state.status='Dijeda';clearInterval(timerInterval);save();render();toast('Permainan dijeda.')}}
function resumeGame(){if(state.status==='Dijeda'){state.status='Berlangsung';state.endsAt=Date.now()+Math.max(0,state.remaining)*1000;save();render();runTimer();toast('Permainan dilanjutkan.')}}
function endQuestion(){state.status='Menunggu';state.endsAt=null;clearInterval(timerInterval);save();render();toast('Soal ditutup.')}function endGame(){state.status='Selesai';state.endsAt=null;clearInterval(timerInterval);save();render();toast('Permainan selesai. Hasil sudah direkap.')}function nextQuestion(){state.questionIndex++;state.remaining=Number(currentQ()?.duration||state.duration);state.endsAt=null;state.status='Menunggu';state.revealed=false;clearInterval(timerInterval);save();render();toast('Berpindah ke soal berikutnya.')}
function toggleReveal(){state.revealed=!state.revealed;save();render()}
function selectGameMember(id){let m=allMembers().find(x=>x.id===Number(id));state.student=m||null;save();render()}function submitAnswer(e,qid){e.preventDefault();if(state.status!=='Berlangsung'||state.remaining<=0){toast('Waktu menjawab sudah ditutup.');return}if(!state.student){toast('Pilih identitas murid terlebih dahulu.');return}let key=`${state.student.id}-${qid}`;if(state.answers[key]){toast('Jawaban sudah pernah dikirim.');return}let q=state.questions.find(x=>x.id===qid),form=e.target,answer=new FormData(form).get('ans')?.toString().trim()||'',norm=s=>String(s).toLowerCase().replace(/[°\s]/g,'').replace(',','.');let correct=norm(answer)===norm(q.answer);let bonus=state.bonusOn&&correct?Math.round(Number(q.bonus||state.bonus)*(state.remaining/Math.max(1,Number(q.duration||state.duration)))):0;let score=correct?Number(q.points||state.base)+bonus:0;state.answers[key]={memberId:state.student.id,qid,answer,correct,score,teamId:state.student.teamId,arena:state.student.arena,time:new Date().toISOString()};let t=state.teams.find(t=>t.members.some(m=>m.id===state.student.id));if(t){let m=t.members.find(m=>m.id===state.student.id);m.score+=score}state.history.push({name:state.student.name,team:t?.name,score,qid,correct});save();render();toast(correct?`Tepat! Kamu mendapat ${score} poin.`:'Jawaban terkirim. Tetap semangat!')}
function newSession(){if(!confirm('Buat sesi baru? Skor dan jawaban saat ini akan direset.'))return;state.sessionCode='CQ-'+Math.random().toString(36).slice(2,6).toUpperCase();state.status='Persiapan';state.endsAt=null;state.questionIndex=0;state.answers={};state.history=[];state.remaining=state.duration;state.revealed=false;state.teams.forEach(t=>t.members.forEach(m=>m.score=0));save();render();toast('Sesi baru dibuat.')}
function resetConfirm(){if(confirm('Reset semua skor, jawaban, dan status sesi?'))newSession()}
function addTeam(){let id=Math.max(0,...state.teams.map(t=>t.id))+1;state.teams.push({id,name:'Tim '+String.fromCharCode(64+id),members:[]});save();render()}function removeTeam(id){let t=state.teams.find(t=>t.id===id);if(t&&confirm(`Hapus ${t.name} beserta anggotanya?`)){state.teams=state.teams.filter(t=>t.id!==id);save();render()}}function renameTeam(id,name){let t=state.teams.find(t=>t.id===id);if(t)t.name=name.trim()||t.name;save()}function addMember(tid){let t=state.teams.find(t=>t.id===tid);if(!t)return;let name=prompt('Masukkan nama murid:');if(!name||!name.trim())return;if(allMembers().some(m=>m.name.trim().toLowerCase()===name.trim().toLowerCase())){toast('Nama murid sudah terdaftar.');return}let id=Math.max(0,...allMembers().map(m=>m.id))+1;t.members.push({id,name:name.trim(),number:t.members.length+1,arena:state.arenas[0]?.id||1,score:0});save();render()}function removeMember(tid,mid){let t=state.teams.find(t=>t.id===tid);if(t&&confirm('Hapus anggota ini?')){t.members=t.members.filter(m=>m.id!==mid);save();render()}}function editMember(tid,mid,key,val){let t=state.teams.find(t=>t.id===tid),m=t?.members.find(m=>m.id===mid);if(m){if(key==='name')m.name=val;else m[key]=Number(val);save();if(key==='arena')render()}}function addArena(){let id=Math.max(0,...state.arenas.map(a=>a.id))+1;state.arenas.push({id,name:'Orbit Baru '+id,hint:'Atur petunjuk guru'});save();render()}function removeArena(id){if(state.arenas.length<=1){toast('Minimal harus ada satu arena.');return}if(confirm('Hapus arena ini?')){state.arenas=state.arenas.filter(a=>a.id!==id);state.teams.forEach(t=>t.members.forEach(m=>{if(m.arena===id)m.arena=state.arenas[0].id}));state.questions=state.questions.filter(q=>q.arena!==id);save();render()}}function editArena(id,key,val){let a=state.arenas.find(a=>a.id===id);if(a){a[key]=val;save()}}
function questionModal(id){let q=id?state.questions.find(q=>q.id===id):{id:Math.max(0,...state.questions.map(q=>q.id))+1,arena:state.arenas[0]?.id||1,title:'Soal baru',type:'number',q:'',options:[],answer:'',explain:'',duration:45,points:100,bonus:30};document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="close-row"><h2>${id?'Edit soal':'Tambah soal'}</h2><button class="outline small" onclick="closeModal()">✕</button></div><form onsubmit="saveQuestion(event,${id||0})"><div class="form-grid"><div class="field"><label>Judul soal</label><input name="title" value="${esc(q.title)}" required></div><div class="field"><label>Arena</label><select name="arena">${state.arenas.map(a=>`<option value="${a.id}" ${Number(q.arena)===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Jenis soal</label><select name="type" id="qtype" onchange="document.getElementById('optsField').classList.toggle('hidden',this.value!=='choice')"><option value="number" ${q.type==='number'?'selected':''}>Jawaban numerik</option><option value="choice" ${q.type==='choice'?'selected':''}>Pilihan ganda</option></select></div><div class="field"><label>Durasi (detik)</label><input name="duration" type="number" min="5" value="${q.duration}" required></div><div class="field"><label>Poin dasar</label><input name="points" type="number" min="0" value="${q.points}" required></div><div class="field"><label>Bonus kecepatan</label><input name="bonus" type="number" min="0" value="${q.bonus}" required></div></div><div class="field" style="margin-top:12px"><label>Pertanyaan</label><textarea name="q" rows="3" required>${esc(q.q)}</textarea></div><div id="optsField" class="field ${q.type==='choice'?'':'hidden'}"><label>Pilihan jawaban (pisahkan dengan tanda |)</label><input name="options" value="${esc((q.options||[]).join(' | '))}" placeholder="20° | 45° | 70° | 140°"></div><div class="field"><label>Kunci jawaban</label><input name="answer" value="${esc(q.answer)}" required></div><div class="field"><label>Pembahasan</label><textarea name="explain" rows="3">${esc(q.explain)}</textarea></div><button class="primary" type="submit">Simpan soal</button> <button type="button" class="outline" onclick="closeModal()">Batal</button></form></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function saveQuestion(e,id){e.preventDefault();let f=new FormData(e.target),q={id:id||Math.max(0,...state.questions.map(q=>q.id))+1,title:f.get('title'),arena:Number(f.get('arena')),type:f.get('type'),q:f.get('q'),options:f.get('type')==='choice'?String(f.get('options')).split('|').map(s=>s.trim()).filter(Boolean):[],answer:f.get('answer').trim(),explain:f.get('explain'),duration:Number(f.get('duration')),points:Number(f.get('points')),bonus:Number(f.get('bonus'))};let i=state.questions.findIndex(x=>x.id===q.id);if(i>=0)state.questions[i]=q;else state.questions.push(q);save();closeModal();render();toast('Soal berhasil disimpan.')}function deleteQuestion(id){if(confirm('Hapus soal ini?')){state.questions=state.questions.filter(q=>q.id!==id);save();render()}}function restoreQuestions(){if(confirm('Pulihkan soal contoh? Soal yang ada akan diganti.')){state.questions=defaultQuestions.map(q=>({...q}));state.questionIndex=0;save();render()}}
function exportCSV(){let rows=[['Jenis','Nama','Kelompok asal','Arena','Poin','Soal','Jawaban','Benar','Waktu']];allMembers().forEach(m=>{let ans=Object.values(state.answers).filter(a=>a.memberId===m.id);if(!ans.length)rows.push(['Anggota',m.name,m.teamName,state.arenas.find(a=>a.id===Number(m.arena))?.name||'',m.score,'','','','']);else ans.forEach(a=>rows.push(['Jawaban',m.name,m.teamName,state.arenas.find(ar=>ar.id===Number(a.arena))?.name||'',a.score,a.qid,a.answer,a.correct?'Ya':'Tidak',a.time]))});state.teams.forEach(t=>rows.push(['Total tim',t.name,t.name,'','',total(t),'','','','']));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='circle-quest-hasil.csv';a.click();URL.revokeObjectURL(url);toast('File CSV diunduh.')}
let pendingStudent=null;
function openStudent(){pendingStudent=null;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="close-row"><h2>Masuk sebagai murid</h2><button class="outline small" type="button" onclick="closeModal()">✕</button></div><p class="muted">Masukkan kode sesi dari guru dan namamu untuk melanjutkan.</p><form id="studentJoinForm" onsubmit="return studentContinue(event)"><div class="field"><label>Kode sesi</label><input name="code" value="${esc(state.sessionCode)}" required autocomplete="off"></div><div class="field"><label>Nama</label><input name="studentName" placeholder="Ketik namamu" maxlength="60" required autocomplete="name"></div><button class="primary" type="button" onclick="studentContinueFromButton()">Berikutnya →</button></form></div></div>`}
function studentContinue(e){if(e&&typeof e.preventDefault==='function')e.preventDefault();studentContinueFromButton();return false}
function studentContinueFromButton(){try{let form=document.getElementById('studentJoinForm');if(!form){toast('Formulir tidak ditemukan. Tutup lalu buka kembali menu murid.');return}let code=String(form.elements.code?.value||'').trim().toUpperCase(),name=String(form.elements.studentName?.value||'').trim();if(!code){toast('Masukkan kode sesi dari guru.');form.elements.code?.focus();return}if(!name){toast('Masukkan nama terlebih dahulu.');form.elements.studentName?.focus();return}if(code!==String(state.sessionCode||'').trim().toUpperCase()){toast('Kode sesi tidak cocok. Gunakan kode yang tampil di dashboard guru.');form.elements.code?.focus();return}if(allMembers().some(m=>String(m.name).trim().toLowerCase()===name.toLowerCase())){toast('Nama ini sudah terdaftar. Gunakan nama yang berbeda atau hubungi guru.');form.elements.studentName?.focus();return}pendingStudent={code,name};studentGroupStep()}catch(err){console.error('Gagal melanjutkan alur murid:',err);toast('Belum bisa lanjut. Tutup formulir lalu coba buka kembali.')}}
function studentGroupStep(){if(!pendingStudent)return openStudent();document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="close-row"><h2>Pilih kelompok</h2><button class="outline small" type="button" onclick="closeModal()">✕</button></div><p class="muted">Halo, <b>${esc(pendingStudent.name)}</b>! Pilih kelompok untuk bergabung. Kamu juga bisa mengubah nama kelompok atau membuat kelompok baru.</p><div class="grid two" style="margin:16px 0">${state.teams.length?state.teams.map(t=>`<div class="card" style="padding:14px"><button class="primary" style="width:100%;min-height:54px" onclick="joinStudentTeam(${t.id})">${esc(t.name)}<br><small style="font-weight:500">${t.members.length} anggota · Pilih kelompok</small></button><div style="margin-top:10px;padding:10px;border-radius:10px;background:var(--soft);text-align:left"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Anggota kelompok</div>${t.members.length?`<ul style="margin:0;padding-left:18px">${t.members.map(m=>`<li style="padding:2px 0;font-size:13px">${esc(m.name)}</li>`).join('')}</ul>`:'<div style="font-size:12px;color:var(--muted)">Belum ada anggota</div>'}</div><button class="outline small" style="width:100%;margin-top:8px" onclick="renameStudentTeam(${t.id})">✎ Ubah nama kelompok</button></div>`).join(''):`<div class="empty" style="grid-column:1/-1">Belum ada kelompok. Buat kelompok baru di bawah.</div>`}</div><div class="card"><h3>Buat kelompok baru</h3><div class="field"><label>Nama kelompok</label><input id="newStudentTeamName" maxlength="40" placeholder="Contoh: Tim Bintang"></div><button class="terra" style="width:100%" onclick="createStudentTeam()">Buat dan pilih kelompok →</button></div><button class="outline" style="margin-top:12px" onclick="openStudent()">← Kembali</button></div></div>`}
function renameStudentTeam(id){let t=state.teams.find(x=>x.id===id);if(!t)return;let name=prompt('Ubah nama kelompok:',t.name);if(name===null)return;name=name.trim();if(!name){toast('Nama kelompok tidak boleh kosong.');return}if(state.teams.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('Nama kelompok itu sudah digunakan.');return}t.name=name;save();studentGroupStep();toast('Nama kelompok berhasil diubah.')}
function createStudentTeam(){if(!pendingStudent)return;let input=document.getElementById('newStudentTeamName'),name=String(input?.value||'').trim();if(!name){toast('Isi nama kelompok terlebih dahulu.');return}if(state.teams.some(t=>t.name.trim().toLowerCase()===name.toLowerCase())){toast('Nama kelompok sudah ada. Pilih tombol kelompok yang tersedia.');return}let id=Math.max(0,...state.teams.map(t=>Number(t.id)||0))+1;state.teams.push({id,name,members:[]});save();joinStudentTeam(id)}
function joinStudentTeam(teamId){if(!pendingStudent)return;let t=state.teams.find(x=>Number(x.id)===Number(teamId));if(!t)return;if(allMembers().some(m=>String(m.name).trim().toLowerCase()===pendingStudent.name.toLowerCase())){toast('Nama ini sudah terdaftar di kelompok.');pendingStudent=null;closeModal();return}let mid=Math.max(0,...allMembers().map(m=>Number(m.id)||0))+1;let member={id:mid,name:pendingStudent.name,arena:state.arenas[0]?.id||1,score:0};t.members.push(member);state.student={...member,teamName:t.name,teamId:t.id};save();studentWaitingRoomStep()}
function studentWaitingRoomStep(){let m=state.student;if(!m)return;let teams=state.teams;document.getElementById('modalRoot').innerHTML=`<div class="kasongan-wait-screen"><div class="kasongan-decor" aria-hidden="true"><svg viewBox="0 0 420 500" xmlns="http://www.w3.org/2000/svg"><ellipse cx="210" cy="455" rx="145" ry="18" fill="#5e2f22" opacity=".15"/><path d="M142 130 Q145 112 164 112 L256 112 Q275 112 278 130 L295 174 Q318 228 303 326 Q292 405 210 415 Q128 405 117 326 Q102 228 125 174 Z" fill="#b85f43" stroke="#7d3c2b" stroke-width="7"/><path d="M142 130 Q210 145 278 130 L270 159 Q210 176 150 159 Z" fill="#d88a65" stroke="#7d3c2b" stroke-width="5"/><ellipse cx="210" cy="117" rx="53" ry="13" fill="#d88a65" stroke="#7d3c2b" stroke-width="7"/><path d="M124 207 Q210 230 296 207 M116 286 Q210 310 304 286 M126 354 Q210 377 294 354" fill="none" stroke="#f5d4b5" stroke-width="7"/><g fill="none" stroke="#f5d4b5" stroke-width="7"><circle cx="210" cy="246" r="34"/><circle cx="210" cy="246" r="19"/><circle cx="210" cy="246" r="5"/><circle cx="168" cy="321" r="12"/><circle cx="210" cy="321" r="12"/><circle cx="252" cy="321" r="12"/></g><g fill="#f5d4b5"><circle cx="150" cy="190" r="5"/><circle cx="270" cy="190" r="5"/><circle cx="145" cy="371" r="5"/><circle cx="275" cy="371" r="5"/></g></svg></div><div class="wait-content"><div class="wait-brand"><span>🏺</span><div><b>CIRCLE QUEST</b><small>Nuansa gerabah Kasongan</small></div></div><div class="wait-heading"><span class="eyebrow" style="color:#a35a40">RUANG TUNGGU</span><h1>Siap untuk tantangan?</h1><p>Hai <b>${esc(m.name)}</b>! Kamu tergabung dalam <b>${esc(m.teamName)}</b>. Cek anggota tiap kelompok di bawah, lalu pilih arena jika sudah siap.</p></div><h2 style="font-size:20px;color:#713b2a;margin:18px 0 10px">Daftar seluruh tim dan anggotanya</h2><div class="wait-team-grid">${teams.length?teams.map(t=>`<section class="wait-team-card ${Number(t.id)===Number(m.teamId)?'selected':''}"><div class="wait-team-title"><h3>${esc(t.name)}</h3><span>${t.members.length} anggota</span></div>${t.members.length?`<ul>${t.members.map(mem=>`<li>${Number(mem.id)===Number(m.id)&&Number(t.id)===Number(m.teamId)?'<b>':''}${esc(mem.name)}${Number(mem.id)===Number(m.id)&&Number(t.id)===Number(m.teamId)?' (kamu)</b>':''}</li>`).join('')}</ul>`:'<p class="wait-empty">Belum ada anggota.</p>'}</section>`).join(''):'<p class="wait-empty">Belum ada kelompok.</p>'}</div><div class="wait-actions"><div><b>Kelompokmu: ${esc(m.teamName)}</b><small>Nama arena dapat diubah oleh guru saja.</small></div><button class="terra" onclick="studentArenaStep()">Pilih arena →</button></div></div></div>`}
function studentArenaStep(){let m=state.student;if(!m)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="close-row"><h2>Pilih arena</h2><button class="outline small" type="button" onclick="closeModal()">✕</button></div><p class="muted">Kamu sudah bergabung dengan <b>${esc(m.teamName)}</b>. Pilih arena untuk langsung masuk ke tantangan. Nama arena hanya dapat diubah oleh guru.</p><div class="grid two" style="margin-top:16px">${state.arenas.map((a,i)=>`<button class="${i%3===1?'terra':i%3===2?'blue':'primary'}" style="min-height:90px;font-size:16px" onclick="enterStudentArena(${a.id})">◉<br>${esc(a.name)}<br><small style="font-weight:500">Masuk arena →</small></button>`).join('')}</div></div></div>`}
function enterStudentArena(arenaId){let m=state.student;if(!m)return;let a=state.arenas.find(x=>Number(x.id)===Number(arenaId));if(!a){toast('Arena tidak ditemukan.');return}m.arena=a.id;let t=state.teams.find(x=>Number(x.id)===Number(m.teamId));let member=t?.members.find(x=>Number(x.id)===Number(m.id));if(member)member.arena=a.id;pendingStudent=null;state.page='student';save();closeModal();render();toast(`Kamu masuk ke ${a.name}!`)}
function studentPage(){let m=state.student,q=currentQ();if(!m)return home();let old=q?state.answers[`${m.id}-${q.id}`]:null;return `${header()}<div class="page-title"><div><h2>Halo, ${esc(m.name)}!</h2><p>${esc(m.teamName)} · ${esc(state.arenas.find(a=>a.id===Number(m.arena))?.name||'Arena')}</p></div><button class="outline" onclick="state.student=null;go('home')">Keluar</button></div>${state.status!=='Berlangsung'?`<div class="card" style="text-align:center;padding:48px 20px"><div style="font-size:48px">⏳</div><h2>Menunggu permainan dimulai</h2><p class="muted">Tetap siap. Guru akan memulai tantangan untuk semua arena.</p><span class="pill">Kode sesi ${esc(state.sessionCode)}</span></div>`:`<div class="game-layout"><div class="card"><span class="arena-badge">SOAL ${state.questionIndex+1}</span><span class="pill" style="float:right">⏱ <span id="questionTimer">${formatTime(state.remaining)}</span></span><p class="question">${esc(q?.q||'Belum ada soal untuk arena ini.')}</p><div id="studentAnswer">${q?answerForm(q):''}</div>${state.revealed&&q?`<div class="notice"><b>Kunci: ${esc(q.answer)}</b><br>${esc(q.explain)}</div>`:''}</div><div class="card"><span class="muted" style="font-size:12px">SISA WAKTU</span><div class="timer" id="timer">${formatTime(state.remaining)}</div><div class="progress"><div id="timerBar" style="width:${100*state.remaining/Math.max(1,q?.duration||state.duration)}%"></div></div><h3>Skor kamu</h3><div class="stat"><span>Total poin individu</span><strong>${m.score}</strong></div><p class="muted" style="font-size:12px">Poinmu ikut membantu kelompok asal.</p></div></div>`}<section class="section">${towerGrid()}</section>`}
function render(){let root=document.getElementById('app');if(state.page==='home')root.innerHTML=home();else if(state.page==='student')root.innerHTML=studentPage();else if(!teacherAuthenticated){state.page='home';root.innerHTML=home();openTeacherLogin()}else root.innerHTML=teacher();}initCloud();
</script></body></html>
